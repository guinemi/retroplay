
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RetroPlay</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #10101b;
    color: white;
    font-family: Arial, sans-serif;
}

header {
    background: #19192b;
    padding: 25px;
    text-align: center;
    border-bottom: 2px solid #00e5a0;
}

header h1 {
    color: #00e5a0;
    margin: 0;
    font-size: 32px;
}

header p {
    color: #aaa;
}

h2 {
    text-align: center;
    margin-top: 35px;
}

.jogos {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 25px;
    padding: 30px 15px;
}

.card {
    width: 220px;
    background: #202035;
    border-radius: 12px;
    padding: 15px;
    text-align: center;
    cursor: pointer;
    transition: .2s;
}

.card:hover {
    transform: scale(1.05);
    box-shadow: 0 0 15px #00e5a055;
}

.card img {
    width: 100%;
    height: 270px;
    object-fit: contain;
    border-radius: 8px;
}

.card h3 {
    margin-bottom: 5px;
}

.card p {
    color: #aaa;
}

button {
    background: #00e5a0;
    color: #10101b;
    border: none;
    padding: 12px 25px;
    border-radius: 7px;
    font-weight: bold;
    cursor: pointer;
}

footer {
    text-align: center;
    padding: 30px;
    color: #777;
}
</style>
</head>

<body>

<header>
    <h1>🎮 RETROPLAY</h1>
    <p>Seu mundo de jogos retrô!</p>
</header>

<h2>Escolha seu jogo</h2>

<div class="jogos">

    <div class="card" onclick="abrirJogo('fifa')">
        <img
        src="capas/fifa.jpg"
        alt="FIFA Street"
        onerror="this.src='https://placehold.co/220x270/202035/00e5a0?text=FIFA+Street'">

        <h3>⚽ FIFA Street</h3>
        <p>PlayStation Portable</p>
        <button>JOGAR</button>
    </div>

    <div class="card" onclick="abrirJogo('zelda')">
        <img
        src="capas/zelda.jpg"
        alt="The Legend of Zelda"
        onerror="this.src='https://placehold.co/220x270/202035/00e5a0?text=Zelda'">

        <h3>🗡️ Zelda</h3>
        <p>Nintendo NES</p>
        <button>JOGAR</button>
    </div>

</div>

<footer>
    RETROPLAY © 2026
</footer>

<script>
function abrirJogo(jogo) {
    window.location.href = "jogar.html?game=" + jogo;
}
</script>

</body>
</html>
